[build]
  base    = ""
  command = "mkdir -p _site && cp zuzan-landing.html _site/index.html"
  publish = "_site"
  ignore  = "git diff --quiet HEAD^ HEAD -- zuzan-landing.html"

# Security headers for the landing site (security audit 2026-11-23)
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://zuzan-backend.onrender.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'"
