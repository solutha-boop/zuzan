<!DOCTYPE html>
<html lang="en-ZA">
  <head>
    <meta charset="utf-8" />
    <script>
      // The Render address is only a fallback: send everyone to the real domain, keeping the path (client portal
      // links, password-reset links), query string and hash. Exact host match, so app.zuzan.co.za never loops.
      if (location.hostname === "zuzan-app.onrender.com") {
        location.replace("https://app.zuzan.co.za" + location.pathname + location.search + location.hash);
      }
    </script>
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#C8401A" />
    <meta name="description" content="ZuZan — South African bookkeeping, payroll and invoicing platform for SMEs" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ZuZan" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;800&display=swap" rel="stylesheet">
    <title>ZuZan — SA Bookkeeping</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run ZuZan.</noscript>
    <div id="root"></div>
  </body>
</html>
